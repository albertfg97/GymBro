<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymBro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="container">

    <!-- SCREEN: Login -->
    <section id="screen-login" class="screen">
      <div class="form-card">
        <h1 class="title">GymBro</h1>
        <p class="subtitle">Empezar</p>
        <form id="form-login" class="form">
          <input type="text" id="login-name" placeholder="Usuario" required tabindex="0" autocomplete="username">
          <input type="password" id="login-password" placeholder="Contraseña" required tabindex="0" autocomplete="current-password">
          <button type="submit" class="btn-primary btn-big" tabindex="0">Entrar</button>
        </form>
        <button class="btn-link" id="btn-show-register" tabindex="0">Crear cuenta</button>
        <p id="login-error" class="error" hidden></p>
      </div>
    </section>

    <!-- SCREEN: Register -->
    <section id="screen-register" class="screen" hidden>
      <div class="form-card form-card--wide">
        <h1 class="title">Crear cuenta</h1>
        <form id="form-register" class="form form--grid">
          <input type="text" id="reg-name" placeholder="Usuario" required tabindex="0">
          <input type="password" id="reg-password" placeholder="Contraseña" required tabindex="0">
          <select id="reg-sex" tabindex="0">
            <option value="">Sexo</option>
            <option value="male">Hombre</option>
            <option value="female">Mujer</option>
            <option value="other">Otro</option>
          </select>
          <input type="number" id="reg-birth" placeholder="Año nacimiento (1995)" min="1900" max="2100" tabindex="0">
          <input type="number" id="reg-height" placeholder="Altura (cm)" min="50" max="250" tabindex="0">
          <input type="number" id="reg-weight" placeholder="Peso (kg)" min="20" max="300" tabindex="0">
          <select id="reg-goal" tabindex="0">
            <option value="maintain">Objetivo: Mantener</option>
            <option value="lose">Perder peso</option>
            <option value="gain">Ganar músculo</option>
          </select>
          <select id="reg-activity" tabindex="0">
            <option value="light">Nivel: Ligero</option>
            <option value="sedentary">Sedentario</option>
            <option value="active">Activo</option>
            <option value="very_active">Muy activo</option>
          </select>
          <button type="submit" class="btn-primary" tabindex="0">Registrarse</button>
        </form>
        <button class="btn-link" id="btn-show-login" tabindex="0">Ya tengo cuenta</button>
        <p id="register-error" class="error" hidden></p>
      </div>
    </section>

    <!-- MODE SELECTOR (each login) -->
    <div class="overlay" id="mode-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <h2 id="mode-title">¿Cómo vas a usar GymBro?</h2>
        <div class="mode-options">
          <button class="btn-primary btn-big" id="mode-tv" tabindex="0">📺 En la TV</button>
          <button class="btn-secondary btn-big" id="mode-movil" tabindex="0">📱 En el móvil</button>
        </div>
      </div>
    </div>

    <!-- SCREEN: Home (TV mode: routine of the day) -->
    <section id="screen-home" class="screen" hidden>
      <header class="header">
        <div>
          <h1 class="title">GymBro</h1>
          <p class="greeting" id="greeting"></p>
        </div>
        <button class="btn-link" id="btn-logout" tabindex="0">Salir</button>
      </header>

      <!-- TV home -->
      <div id="tv-home" class="tv-home" hidden>
        <div id="tv-today" class="tv-today"></div>
      </div>

      <!-- Mobile home -->
      <div id="mobile-home" class="mobile-home" hidden>
        <nav class="mobile-tabs">
          <button class="btn-tab active" data-mtab="alimentacion" tabindex="0">Alimentación</button>
          <button class="btn-tab" data-mtab="rutina" tabindex="0">Rutina</button>
          <button class="btn-tab" data-mtab="seguimiento" tabindex="0">Seguimiento</button>
          <button class="btn-tab" data-mtab="perfil" tabindex="0">Perfil</button>
        </nav>
        <div id="mtab-alimentacion" class="mtab" hidden></div>
        <div id="mtab-rutina" class="mtab" hidden></div>
        <div id="mtab-seguimiento" class="mtab" hidden></div>
        <div id="mtab-perfil" class="mtab" hidden></div>
      </div>
    </section>

    <!-- SCREEN: Guided workout -->
    <section id="screen-workout" class="screen" hidden>
      <div class="workout-card">
        <span class="workout-label" id="workout-label"></span>
        <span class="workout-icon" id="workout-icon">🏋️</span>
        <h2 class="workout-name" id="workout-name">Ejercicio</h2>
        <div class="workout-meta" id="workout-meta"></div>
        <div class="workout-media" id="workout-media"></div>
        <div class="workout-coach" id="workout-coach" hidden>
          <div class="coach-progress" id="coach-progress"></div>
          <p class="coach-line" id="coach-line">Sigue estos pasos.</p>
          <div class="coach-controls">
            <button class="btn-secondary" id="coach-prev" tabindex="0">◀ Anterior</button>
            <button class="btn-secondary btn-listening" id="coach-listen" tabindex="0">🔊</button>
            <button class="btn-secondary" id="coach-next" tabindex="0">Siguiente ▶</button>
          </div>
        </div>
        <p class="workout-hint" id="workout-hint">Realiza el ejercicio y presiona Completar cuando termines</p>
        <div class="workout-timer" id="workout-timer">⏱ 0:00</div>
        <div class="workout-reps-panel" id="workout-reps-panel" hidden>
          <label>Series <input type="number" id="workout-sets" min="1" max="99" placeholder="Series"></label>
          <label>Reps <input type="text" id="workout-reps" placeholder="Repeticiones"></label>
          <label>Peso <input type="number" id="workout-weight" min="0" step="0.5" placeholder="kg"></label>
        </div>
        <button class="btn-primary btn-big" id="workout-complete" tabindex="0">✓ Completar</button>
        <button class="btn-secondary" id="workout-cancel" tabindex="0">Cancelar</button>
      </div>
    </section>

    <!-- MODAL (how-to guide preview) -->
    <div class="overlay" id="overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <h2 id="modal-title"></h2>
        <div class="modal-guide-media" id="modal-guide-media"></div>
        <ol class="modal-guide-steps" id="modal-guide-steps"></ol>
        <div class="modal-guide-watch" id="modal-guide-watch"></div>
        <button class="btn-primary" id="modal-start" tabindex="0">Comenzar</button>
        <button class="btn-secondary" id="modal-close" tabindex="0">Cerrar</button>
      </div>
    </div>

    <!-- RESULT OVERLAY -->
    <div class="overlay" id="result-overlay" hidden>
      <div class="modal result-card" role="dialog" aria-modal="true">
        <h2 class="result-title">🎉 Completado</h2>
        <p class="result-points" id="result-points"></p>
        <button class="btn-primary btn-big" id="result-ok" tabindex="0">Continuar</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
